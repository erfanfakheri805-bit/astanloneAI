# Prompt 815: manual-only Android debug build path.
# Nothing here runs automatically; start it from the Actions tab
# ("Run workflow"). No secrets, no signing keys, no network services
# beyond fetching build tooling. Produces an unsigned-by-you debug APK
# (Gradle's standard debug keystore).
name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python regression suite
        working-directory: app/src/main/python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t . -q

  build-debug-apk:
    needs: python-regression
    runs-on: ubuntu-24.04
    # Needed only to publish the APK to GitHub Releases (step at the end).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy's buildPython must match the app's Python (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The action's default `packages` is "tools platform-tools"; the legacy
      # "tools" package no longer exists in the SDK repository and made
      # sdkmanager exit 1 (Prompt 823). Request only platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # No Gradle wrapper is committed; AGP 8.5.2 needs Gradle >= 8.7.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Publish the APK as a downloadable GitHub Release (Releases page).
      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Debug APK build ${{ github.run_number }}" \
            --notes "Debug APK built from commit $GITHUB_SHA. Download the .apk file below and install it on your Android phone." \
            --prerelease
