apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.erfan.standaloneai'
    compileSdk 34

    defaultConfig {
        applicationId "com.erfan.standaloneai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"

        python {
            // Foundation stage uses only the Python standard library,
            // so no pip { install [...] } block is needed.
            //
            // Prompt 815: pin the on-device Python to the same minor
            // version the regression suite is verified on (3.12). The
            // build machine must provide python3.12 (buildPython).
            version "3.12"
        }

        ndk {
            // Chaquopy supports 32-bit ABIs only for Python 3.11 and
            // older, so a Python 3.12 build is 64-bit only. arm64-v8a
            // covers current real devices and keeps the APK small.
            abiFilters "arm64-v8a"
        }
    }

    // Prompt 822: release signing is read from environment variables that
    // the "Android signed release" GitHub Actions workflow sets from
    // repository secrets. No keystore or credential is stored in the
    // repository. When the variables are absent (local/debug builds) the
    // release build type is simply left unsigned.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Personal-use debug build: Gradle auto-generates and signs
            // with the standard debug keystore, no secrets required.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Prompt 958: only when the build includes the on-device language-model engine (see "dependencies" below).
    // The engine's native library and the ones another library ships can carry the same C++ runtime file;
    // keep the first copy instead of failing the packaging step.
    if (project.findProperty('withLlm') == 'true') {
        packaging {
            jniLibs {
                pickFirsts.add('**/libc++_shared.so')
            }
        }
    }
}

// Prompt 826: kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes.
// Drop the old standalone jdk7/jdk8 artifacts (1.6.21) that a transitive
// dependency still pulls in, which caused :app:checkDebugDuplicateClasses
// to fail with duplicate kotlin.* classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // Prompt 825: align every Kotlin stdlib module to one version.
    // Without this, kotlin-stdlib 1.8.22 (via appcompat) clashes with
    // kotlin-stdlib-jdk7/jdk8 1.6.21 pulled in transitively, and
    // :app:checkDebugDuplicateClasses fails.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Prompt 958: the engine that runs a language-model file ON THE PHONE (Google's MediaPipe LLM Inference,
    // Apache-2.0). It is added only when the build is asked for it (gradle -PwithLlm=true): the GitHub workflow
    // tries that first and, if the engine cannot be built in, builds the same app without it and says so in the
    // release notes. The app itself never needs it to start: with no engine a model file is only stored and
    // checked, and the chat says exactly that.
    if (project.findProperty('withLlm') == 'true') {
        implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    }
}
