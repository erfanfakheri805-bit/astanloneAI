apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.erfan.standaloneai'
    compileSdk 34

    defaultConfig {
        applicationId "com.erfan.standaloneai"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"

        python {
            // Foundation stage uses only the Python standard library,
            // so no pip { install [...] } block is needed.
            //
            // Prompt 815: pin the on-device Python to the same minor
            // version the regression suite is verified on (3.12). The
            // build machine must provide python3.12 (buildPython).
            version "3.12"
        }

        ndk {
            // Chaquopy supports 32-bit ABIs only for Python 3.11 and
            // older, so a Python 3.12 build is 64-bit only. arm64-v8a
            // covers current real devices and keeps the APK small.
            abiFilters "arm64-v8a"
        }
    }

    // Prompt 822: release signing is read from environment variables that
    // the "Android signed release" GitHub Actions workflow sets from
    // repository secrets. No keystore or credential is stored in the
    // repository. When the variables are absent (local/debug builds) the
    // release build type is simply left unsigned.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Personal-use debug build: Gradle auto-generates and signs
            // with the standard debug keystore, no secrets required.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Prompt 958: only when the build includes the on-device language-model engine (see "dependencies" below).
    // The engine's native library and the ones another library ships can carry the same C++ runtime file;
    // keep the first copy instead of failing the packaging step.
    if (project.findProperty('withLlm') == 'true') {
        packaging {
            jniLibs {
                pickFirsts.add('**/libc++_shared.so')
            }
        }
    }

    // Prompt 959: the same for the phone's OWN brain engine (LiteRT-LM, see "dependencies" below). Its AAR and the
    // runtime libraries it pulls in can carry the same native files; keep the first copy of each instead of failing the
    // packaging step. (A pattern that matches no file is harmless.)
    if (project.findProperty('withLiteRtLm') == 'true') {
        packaging {
            jniLibs {
                pickFirsts.add('**/libc++_shared.so')
                pickFirsts.add('**/libLiteRt*.so')
                pickFirsts.add('**/liblitert*.so')
            }
            // Prompt 959 (stage B): the libraries the engine pulls in can each ship the same licence / notice file; keep the first copy
            // of those (never a class, never a service registration) instead of failing the "merge Java resources" step.
            resources {
                pickFirsts.addAll(['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'])
            }
        }
    }

    // Prompt 959 (stage B): the engine's own code (LiteRT-LM 0.19.1, found in the first real build log) uses Java features that Android can
    // only run from Android 8.0 (API 26) on; with minSdk 24 the dex tool stops with "Invoke-customs are only supported starting with Android
    // O (--min-api 26)" and no engine gets into the APK. So THIS variant - and only this one - is built for Android 8.0+; the plain and the
    // MediaPipe builds keep minSdk 24. (The default value above stays the literal 24 on purpose: the later assignment wins.)
    if (project.findProperty('withLiteRtLm') == 'true') {
        defaultConfig {
            minSdk 26
        }
    }
}

// Prompt 826: kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes.
// Drop the old standalone jdk7/jdk8 artifacts (1.6.21) that a transitive
// dependency still pulls in, which caused :app:checkDebugDuplicateClasses
// to fail with duplicate kotlin.* classes.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// Prompt 959: only for the build that includes the phone's own brain engine (-PwithLiteRtLm=true). A library can declare
// in its AAR metadata that an app using it must compile against a newer Android API than this project's compileSdk (34).
// Nothing here is compiled against that library (the Java side reaches the engine by reflection) and the phone this build
// is for runs a newer Android, so that check could only stop the build for no real reason; it is switched off for THIS
// variant only. If the engine then misbehaves at run time the app says so (api_mismatch / engine_load_failed): it does
// not crash. The other builds (MediaPipe, no engine) keep the check.
if (project.findProperty('withLiteRtLm') == 'true') {
    tasks.configureEach { task ->
        if (task.name.startsWith('check') && task.name.endsWith('AarMetadata')) {
            task.enabled = false
        }
    }
}

dependencies {
    // Prompt 825: align every Kotlin stdlib module to one version.
    // Without this, kotlin-stdlib 1.8.22 (via appcompat) clashes with
    // kotlin-stdlib-jdk7/jdk8 1.6.21 pulled in transitively, and
    // :app:checkDebugDuplicateClasses fails.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Prompt 958: the engine that runs a language-model file ON THE PHONE (Google's MediaPipe LLM Inference,
    // Apache-2.0). It is added only when the build is asked for it (gradle -PwithLlm=true): the GitHub workflow
    // tries that first and, if the engine cannot be built in, builds the same app without it and says so in the
    // release notes. The app itself never needs it to start: with no engine a model file is only stored and
    // checked, and the chat says exactly that.
    if (project.findProperty('withLlm') == 'true') {
        implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    }

    // Prompt 959: the engine that runs the phone's OWN brain (Google's LiteRT-LM, Apache-2.0; ".litertlm" model files such
    // as Gemma 4 or Qwen 3.5). Like the one above it is added only when the build is asked for it (gradle
    // -PwithLiteRtLm=true). The workflow tries it FIRST, then the MediaPipe build, then a build with no engine, so there
    // is always an APK to install; the release notes say which one it is. The version is PINNED to 0.19.1: the one the first real
    // build resolved from "latest.release" (build 19), so every build is the same build and a newer release with another API
    // cannot change it unnoticed. The Java side reaches the engine by reflection, so a different API cannot break the build - it
    // is reported at run time (api_mismatch, with the engine's own listing) instead. Moving to a newer version is a deliberate
    // edit of this one line. It could not be built here (no Android SDK offline): the first real build decides.
    if (project.findProperty('withLiteRtLm') == 'true') {
        implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.1'
    }
}
